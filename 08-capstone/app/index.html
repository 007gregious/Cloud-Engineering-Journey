<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Engineering Journey</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 48px;
      max-width: 520px;
      text-align: center;
    }
    .badge {
      background: #238636;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    p { color: #8b949e; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .stack {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }
    .tag {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      color: #79c0ff;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">✅ DEPLOYED</span>
    <h1>Cloud Engineering Journey</h1>
    <p>
      Deployed via GitHub Actions → Amazon ECR → ECS Fargate.
      Infrastructure provisioned with Terraform.
    </p>
    <div class="stack">
      <span class="tag">AWS ECS</span>
      <span class="tag">Terraform</span>
      <span class="tag">Docker</span>
      <span class="tag">GitHub Actions</span>
      <span class="tag">CloudWatch</span>
      <span class="tag">VPC</span>
    </div>
  </div>
</body>
</html>
